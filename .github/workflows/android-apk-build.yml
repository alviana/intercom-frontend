name: Build Android APK

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web (Android entry)
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: npm run build:android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Android release signing
        if: matrix.variant == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Release APK signing secrets are required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/intercom-release.keystore"

      - name: Assemble ${{ matrix.variant }} APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ matrix.variant }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease \
              -PINTERCOM_RELEASE_STORE_FILE="${RUNNER_TEMP}/intercom-release.keystore" \
              -PINTERCOM_RELEASE_STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}" \
              -PINTERCOM_RELEASE_KEY_ALIAS="${ANDROID_KEY_ALIAS}" \
              -PINTERCOM_RELEASE_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Verify release APK signatures
        if: matrix.variant == 'release'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "apksigner was not found under ${ANDROID_HOME}/build-tools."
            exit 1
          fi
          shopt -s nullglob
          for apk in android/app/build/outputs/apk/release/*.apk; do
            "${APKSIGNER}" verify --verbose "$apk"
          done

      - name: Collect APK artifacts
        run: |
          set -euo pipefail
          VARIANT="${{ matrix.variant }}"
          OUT="android/app/build/outputs/apk/${VARIANT}"
          DEST="dist/android-apk-${VARIANT}"
          mkdir -p "$DEST"
          shopt -s nullglob
          for apk in "$OUT"/*.apk; do
            cp "$apk" "$DEST/"
          done
          echo "APKs in ${DEST}:"
          ls -la "$DEST"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-intercom-apk-${{ matrix.variant }}-${{ github.sha }}
          path: dist/android-apk-${{ matrix.variant }}/*.apk
          if-no-files-found: error
          retention-days: 30
